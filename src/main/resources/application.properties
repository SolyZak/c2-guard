# Kafka Configuration
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.bootstrap-servers=${KAFKA_URL:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.bootstrap-servers=${KAFKA_URL:localhost:9092}
spring.kafka.consumer.group-id=crm-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages='*'
spring.kafka.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# TODO :: may be REMOVE in future, This is asked from yasser and I don't know why doing it :D as its very bad for performance
spring.kafka.producer.acks=all
logging.level.org.apache.kafka = ${KAFKA_LOG : ERROR}
logging.level.org.springframework.kafka = ${KAFKA_LOG : ERROR}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.mvc.log-request-details=true
